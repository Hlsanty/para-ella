<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lo que amo de mi mujer hermosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b0f1f;--bg2:#4a1530;--ink:#fdeef2;--soft:#e9b8c6;--rose:#ff7d9c;--gold:#f6d6a0;--off:#6b3550;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff1f4;--bg2:#ffd9e3;--ink:#4a1530;--soft:#8c4562;--rose:#d6366a;--gold:#a8682a;--off:#f0c2d0}}
:root[data-theme="light"]{--bg:#fff1f4;--bg2:#ffd9e3;--ink:#4a1530;--soft:#8c4562;--rose:#d6366a;--gold:#a8682a;--off:#f0c2d0}
html{min-height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg) 70%) fixed;color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 20px}
main{width:100%;max-width:520px;text-align:center}
.hearts{display:flex;justify-content:center;gap:8px;margin-bottom:26px}
.hearts svg{width:22px;height:22px;fill:var(--off);transition:fill .4s,transform .4s}
.hearts svg.on{fill:var(--rose);transform:scale(1.15)}
.card{display:flex;flex-direction:column;align-items:center;transition:opacity .35s,transform .35s}
.card.out{opacity:0;transform:translateY(10px)}
.foto{width:210px;height:260px;object-fit:cover;border-radius:105px 105px 20px 20px;border:3px solid var(--gold);margin-bottom:24px;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.count{font-family:"Fraunces",serif;font-style:italic;color:var(--gold);margin:0 0 10px}
h1{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(1.9rem,7.5vw,2.8rem);line-height:1.12;margin:0 0 14px}
p.txt{font-size:1.1rem;line-height:1.6;color:var(--soft);margin:0;max-width:38ch}
.final h1{font-style:italic;font-weight:400;font-size:clamp(2.3rem,9vw,3.6rem)}
button{margin-top:30px;font:700 1.05rem "DM Sans",sans-serif;color:#2b0f1f;background:linear-gradient(135deg,var(--gold),var(--rose));border:0;border-radius:999px;padding:15px 44px;cursor:pointer;transition:transform .15s;box-shadow:0 8px 24px rgba(255,125,156,.3)}
button:hover{transform:translateY(-2px)}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.cover h1{font-size:clamp(2.9rem,14vw,5.2rem);line-height:1.02;margin:0}
.cover .count{font-size:1.2rem;margin-bottom:18px}
.dog{width:min(72vw,300px);height:auto;margin-bottom:6px}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.5s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.07)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.beat{animation:none}}
#mute{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;margin:0;padding:0;width:44px;height:44px;font-size:1.2rem;line-height:1;background:rgba(0,0,0,.25);box-shadow:none;color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="hearts" id="hearts" aria-hidden="true"></div>
  <div class="card" id="card" aria-live="polite"></div>
  <button id="btn">Siguiente</button>
  <audio id="music" src="cancion.mp3" loop preload="auto"></audio>
  <button id="mute" aria-label="Silenciar o reanudar la música">🔊</button>
</main>

const razones = [
  ["Cuando desapareces, te extraño", "Siempre te extraño cuando se te pierde el rato y no me escribes.", FOTO2],
  ["Un mensajito tuyo", "Con un solo mensajito tuyo me alegras el día entero.", FOTO1],
  ["Siempre voy a estar ahí", "Cuando me necesites, aquí voy a estar. Siempre.", null],
  ["Tu sonrisa", "Me basta verla para que se me olvide lo pesado del día.", null],
  ["Tus ojos", "Podría quedarme mirándolos horas, aunque sea por una pantalla.", null],
  ["Lo hermosa que eres", "Por fuera y por dentro. A veces todavía no me creo que seas mi novia.", null],
  ["Cómo me haces querer ser mejor", "Contigo quiero crecer, esforzarme y cumplir lo que sueño.", null],
  ["Que la distancia no nos gane", "Aunque estemos lejos, tú logras hacerme sentir cerca.", null],
  ["Pensar en el día que nos veamos", "Ya sé lo primero que voy a hacer: abrazarte y no soltarte.", null],
  ["Simplemente tú", "Tal cual eres. No te cambiaría nada.", null]
];
const heart = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.8 4.5 6.5 4.5c2 0 3.6 1.1 5.5 3.2 1.9-2.1 3.5-3.2 5.5-3.2 3.7 0 5.6 3.9 4.1 7.3C19.5 16.4 12 21 12 21z"/></svg>';
const hearts = document.getElementById('hearts'), card = document.getElementById('card'), btn = document.getElementById('btn');
hearts.innerHTML = heart.repeat(razones.length);
let i = -1;
const DOG = `<svg class="dog" viewBox="0 0 300 300" aria-hidden="true"><g class="beat"><path transform="translate(40 95) scale(9)" fill="#ff5c85" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.8 4.5 6.5 4.5c2 0 3.6 1.1 5.5 3.2 1.9-2.1 3.5-3.2 5.5-3.2 3.7 0 5.6 3.9 4.1 7.3C19.5 16.4 12 21 12 21z"/></g><ellipse cx="97" cy="150" rx="22" ry="14" transform="rotate(-25 97 150)" fill="#fff" stroke="#2b0f1f" stroke-width="3"/><ellipse cx="203" cy="150" rx="22" ry="14" transform="rotate(25 203 150)" fill="#fff" stroke="#2b0f1f" stroke-width="3"/><circle cx="150" cy="92" r="52" fill="#fff" stroke="#2b0f1f" stroke-width="3"/><ellipse cx="98" cy="95" rx="13" ry="30" transform="rotate(10 98 95)" fill="#2b0f1f"/><ellipse cx="202" cy="95" rx="13" ry="30" transform="rotate(-10 202 95)" fill="#2b0f1f"/><circle cx="132" cy="88" r="5" fill="#2b0f1f"/><circle cx="168" cy="88" r="5" fill="#2b0f1f"/><ellipse cx="150" cy="104" rx="11" ry="8" fill="#2b0f1f"/><path d="M138 116q12 10 24 0" fill="none" stroke="#2b0f1f" stroke-width="3" stroke-linecap="round"/><circle cx="118" cy="108" r="7" fill="#ff9db5" opacity=".6"/><circle cx="182" cy="108" r="7" fill="#ff9db5" opacity=".6"/></svg>`;
function render(){
  const hs = hearts.children, n = razones.length;
  hearts.style.visibility = (i < 0 || i >= n) ? 'hidden' : 'visible';
  for (let k = 0; k < hs.length; k++) hs[k].classList.toggle('on', k <= i);
  if (i < 0){
    card.className = 'card cover';
    card.innerHTML = '<p class="count">Para ti</p><h1>Cosas que amo de mi mujer hermosa</h1>';
    btn.textContent = 'Empezar';
  } else if (i < n){
    const r = razones[i];
    card.className = 'card';
    card.innerHTML = (r[2] ? '<img class="foto" alt="" src="' + r[2] + '">' : '') +
      '<p class="count">' + (i + 1) + ' de ' + n + '</p><h1>' + r[0] + '</h1><p class="txt">' + r[1] + '</p>';
    btn.textContent = 'Siguiente';
  } else {
    card.className = 'card final';
    card.innerHTML = DOG + '<h1>Te amo con toda mi alma</h1>';
    btn.textContent = 'Volver a empezar';
  }
}
function next(){
  card.classList.add('out');
  setTimeout(function(){ i = i < razones.length ? i + 1 : -1; render(); }, 300);
}
const music = document.getElementById('music'), mute = document.getElementById('mute');
btn.addEventListener('click', function(){
  if (i === -1 && !music.dataset.started){
    music.dataset.started = '1';
    music.play().then(function(){ mute.style.display = 'block'; mute.textContent = '🔊'; }).catch(function(){});
  }
  next();
});
mute.addEventListener('click', function(){
  if (music.paused){ music.play(); mute.textContent = '🔊'; } else { music.pause(); mute.textContent = '🔇'; }
});
document.addEventListener('keydown', function(e){ if (e.key === 'ArrowRight') btn.click(); });
render();
</script>
